name: Prüfen, testen und auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfung, Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Bricht ab, wenn Begriffe, Schriften oder Anfragen an fremde Server gegen docs/RECHTLICHES.md verstoßen
      - name: Compliance-Prüfung (Eigenständigkeit, Lizenzen, Datenschutz)
        run: npm run check:compliance
      - name: Unit-Tests (Simulation, Bots, Fortschritt)
        run: npm test
      - name: Browser für Playwright
        run: npx playwright install --with-deps chromium
      # Playwright baut das Spiel selbst (Typprüfung + vite build) und testet genau den Stand in dist/, der danach veröffentlicht wird
      - name: Playwright-Tests
        run: npm run test:e2e
      - name: Testbericht aufheben, wenn etwas fehlschlägt
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Build für Pages bereitstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Veröffentlichen
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
