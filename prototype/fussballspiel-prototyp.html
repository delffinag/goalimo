:root{
  --bg:#1b2620; --scrim:rgba(20,30,25,.72); --panel:#fff6e6; --ink:#2b2119; --muted:#7a6b5c;
  --card:#f3e6cf; --line:#e0cfb2; --accent:#ffc83d; --fire:#ff7a2f; --ice:#3fb8f0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#1f2a24; --ink:#fff2dc; --muted:#b5a58f; --card:#2a3730; --line:#3a4a41; --scrim:rgba(8,12,10,.78); }
}

*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
html,body{ height:100%; margin:0; overflow:hidden; background:var(--bg); overscroll-behavior:none;

canvas{ display:block; }
