<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2620">
<meta name="description" content="Arena-Fußball 3 gegen 3 mit Touch-Joysticks.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goalimo">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preload" href="/fonts/fredoka-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/nunito-800.woff2" as="font" type="font/woff2" crossorigin>
<title>Goalimo</title>
<!-- Schriften liegen im Spiel selbst (public/fonts/). Es wird nichts von fremden Servern geladen.
     Lizenz: SIL Open Font License 1.1, Texte in licenses/ und im Build unter ./licenses/. -->
<style>
@font-face{ font-family:"Fredoka"; font-style:normal; font-weight:600; font-display:swap; src:url("/fonts/fredoka-600.woff2") format("woff2"); }
@font-face{ font-family:"Nunito"; font-style:normal; font-weight:600; font-display:swap; src:url("/fonts/nunito-600.woff2") format("woff2"); }
@font-face{ font-family:"Nunito"; font-style:normal; font-weight:800; font-display:swap; src:url("/fonts/nunito-800.woff2") format("woff2"); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="hud" hidden><div class="pill" id="sf">0</div><div id="timer">3:00</div><div class="pill" id="si">0</div></div>
  <div id="tut" hidden></div>
  <button id="skip" hidden>Übungsrunde überspringen</button>
  <button id="superBtn" aria-label="Super auslösen" hidden><span>Super</span></button>
  <div id="banner"></div>

  <div id="welcome" class="overlay" hidden>
    <div class="panel">
      <h1 class="display">Willkommen!</h1>
      <p class="sub">Wie heißt du? Dein Name steht im Spiel über deiner Figur und bleibt für immer.</p>
      <input id="welcomeName" minlength="2" maxlength="12" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="Dein Name" aria-label="Dein Name">
      <div><button class="big" id="welcomeGo" disabled>Los geht's</button></div>
    </div>
  </div>

  <div id="lobby" class="overlay lobby" hidden>
    <div class="topPill namePill"><b id="pName"></b></div>
    <div class="topPill medalPill" id="medalPill" aria-label="Gewonnene Medaillen"></div>
    <div class="topPill curPill">
      <span class="taler" aria-hidden="true"></span><b id="talerCount" aria-label="Taler">0</b>
      <span class="training" aria-hidden="true">T</span><b id="trainingCount" aria-label="Trainingspunkte">0</b>
      <span class="kristall" aria-hidden="true"></span><b id="kristallCount" aria-label="Kristalle">0</b>
    </div>
    <button class="figBtn" id="lobbySetup"><span>Figuren</span></button>
    <div class="lcenter">
      <h1 class="display">Goalimo</h1>
      <div class="linfo" id="lobbyInfo"></div>
      <button class="ghost" id="lobbyPraemie" hidden>Prämie wählen</button>
    </div>
    <div class="modePick" id="modePick" role="group" aria-label="Spielmodus wählen">
      <span class="mlabel">Spielmodus</span>
      <div class="mbtns" id="modeBtns"></div>
    </div>
    <button class="big playBtn" id="lobbyPlay">Spielen</button>
  </div>

  <div id="menu" class="overlay figs" hidden>
    <div class="panel figPanel">
      <div class="figHead"><h2 class="display">Wähle deine Figur <span id="figCount"></span></h2><button class="ghost" id="menuBack">Zurück zur Lobby</button></div>
      <div class="tiles" id="cards"></div>
    </div>
    <div class="figModal" id="figModal" hidden>
      <div class="figDetail" role="dialog" aria-labelledby="detName">
        <canvas id="detCv" aria-hidden="true"></canvas>
        <div class="n" id="detName"></div>
        <div class="t" id="detRole"></div>
        <div class="ab" id="detAtk"></div>
        <div class="ab" id="detSup"></div>
        <div id="detStats"></div>
        <div class="upg"><span id="detStufe"></span><button class="ghost" id="detTrain"></button></div>
        <div class="row"><button class="big" id="play">Spielen</button><button class="ghost" id="detPick">Auswählen</button><button class="ghost" id="detClose">Zurück</button></div>
      </div>
    </div>
  </div>

  <div id="praemieView" class="overlay" hidden>
    <div class="panel praemiePanel">
      <h1 class="display">Siegprämie</h1>
      <p class="sub" id="praemieHint">Drei Angebote, du wählst genau eines.</p>
      <div class="offers" id="offers"></div>
      <div class="loot" id="praemieResult" aria-live="polite"></div>
      <button class="big" id="praemieDone" hidden>Fertig</button>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div class="panel">
      <h1 class="display" id="endTitle">Sieg!</h1>
      <div id="endScore"></div>
      <div class="tally" id="endTally"></div>
      <div class="row"><button class="big" id="endAgain">Nochmal spielen</button><button class="big ghostBig" id="endLeave">Spiel verlassen</button></div>
    </div>
  </div>

  <div id="summary" class="overlay" hidden>
    <div class="panel sumPanel">
      <h1 class="display">Sitzung beendet</h1>
      <p class="sub" id="sumMatches"></p>
      <div class="sumRow" id="sumMedals"></div>
      <div class="sumList" id="sumEp"></div>
      <div class="endReward" id="sumReward" hidden></div>
      <div class="row"><button class="big" id="sumPraemie" hidden>Prämie wählen</button><button class="big" id="sumDone">Zur Lobby</button></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
